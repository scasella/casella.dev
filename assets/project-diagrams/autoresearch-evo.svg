<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">autoresearch-evo autonomous search loop</title>
  <desc id="desc">Novelty search, run memory, agentic review, and candidate patch loop.</desc>
  <rect width="900" height="600" rx="28" fill="#f6f8f4"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4" fill="none" stroke="#82a487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#3c563b" flood-opacity=".12"/>
    </filter>
  </defs>
  <text x="76" y="76" fill="#162537" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="31" font-weight="700">autoresearch-evo</text>
  <text x="76" y="112" fill="#5d675e" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18">Novelty-search-inspired autonomous research with memory and review</text>
  <g transform="translate(450 300)" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#shadow)">
    <circle r="74" fill="#ffffff" stroke="#d7e3d4"/>
    <text y="-8" text-anchor="middle" fill="#162537" font-size="18" font-weight="700">run</text>
    <text y="18" text-anchor="middle" fill="#66717e" font-size="14">memory</text>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#shadow)">
    <rect x="96" y="246" width="142" height="76" rx="16" fill="#fff" stroke="#d7e3d4"/>
    <text x="167" y="292" text-anchor="middle" fill="#162537" font-size="16" font-weight="700">seed ideas</text>
    <rect x="330" y="126" width="142" height="76" rx="16" fill="#fff" stroke="#d7e3d4"/>
    <text x="401" y="172" text-anchor="middle" fill="#162537" font-size="16" font-weight="700">novelty</text>
    <rect x="620" y="246" width="142" height="76" rx="16" fill="#fff" stroke="#d7e3d4"/>
    <text x="691" y="292" text-anchor="middle" fill="#162537" font-size="16" font-weight="700">review</text>
    <rect x="330" y="430" width="142" height="76" rx="16" fill="#fff" stroke="#d7e3d4"/>
    <text x="401" y="476" text-anchor="middle" fill="#162537" font-size="16" font-weight="700">patches</text>
  </g>
  <g stroke="#82a487" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M238 284h126"/>
    <path d="M426 228c-12-36-20-44-25-66"/>
    <path d="M524 300h82"/>
    <path d="M672 322c-34 70-98 116-186 133"/>
    <path d="M380 430c-92-32-146-76-174-110" stroke-dasharray="7 8"/>
  </g>
</svg>
