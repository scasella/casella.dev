<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">nanochat-mlx training flow</title>
  <desc id="desc">Dataset, tokenizer, MLX training loop, checkpoint, and evaluation flow.</desc>
  <rect width="900" height="600" rx="28" fill="#f7f2e8"/>
  <g fill="none" stroke="#ded6c7" stroke-width="1">
    <path d="M80 96h740M80 504h740"/>
    <path d="M140 150h620M140 450h620" opacity=".55"/>
  </g>
  <text x="80" y="76" fill="#182536" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="700">nanochat-mlx</text>
  <text x="80" y="112" fill="#596170" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18">Train a small language model locally on Apple Silicon</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4" fill="none" stroke="#6f91c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#796d5c" flood-opacity=".16"/>
    </filter>
  </defs>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 196)">
      <rect width="150" height="96" rx="16" fill="#fffdfa" stroke="#e7dfd1"/>
      <text x="75" y="43" text-anchor="middle" fill="#192638" font-size="18" font-weight="700">text</text>
      <text x="75" y="68" text-anchor="middle" fill="#66717e" font-size="15">dataset</text>
    </g>
    <g transform="translate(285 196)">
      <rect width="150" height="96" rx="16" fill="#fffdfa" stroke="#e7dfd1"/>
      <text x="75" y="43" text-anchor="middle" fill="#192638" font-size="18" font-weight="700">tokenize</text>
      <text x="75" y="68" text-anchor="middle" fill="#66717e" font-size="15">batches</text>
    </g>
    <g transform="translate(500 170)">
      <rect width="190" height="148" rx="18" fill="#ffffff" stroke="#d9e1ef"/>
      <text x="95" y="42" text-anchor="middle" fill="#192638" font-size="18" font-weight="700">MLX train loop</text>
      <path d="M42 82c34-38 74-38 108 0" stroke="#2aa772" stroke-width="10" stroke-linecap="round"/>
      <text x="95" y="104" text-anchor="middle" fill="#2f7c5c" font-size="15" font-weight="700">loss descends</text>
      <text x="95" y="128" text-anchor="middle" fill="#66717e" font-size="14">unified memory</text>
    </g>
    <g transform="translate(735 196)">
      <rect width="110" height="96" rx="16" fill="#fffdfa" stroke="#e7dfd1"/>
      <text x="55" y="43" text-anchor="middle" fill="#192638" font-size="18" font-weight="700">ckpt</text>
      <text x="55" y="68" text-anchor="middle" fill="#66717e" font-size="15">sample</text>
    </g>
  </g>
  <g stroke="#6f91c8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M220 244h52"/>
    <path d="M435 244h52"/>
    <path d="M690 244h32"/>
    <path d="M790 292v78H250v-54" stroke-dasharray="6 8"/>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="188" y="376" width="524" height="72" rx="28" fill="#e9f4ed" stroke="#b9dcc1" stroke-width="1.5"/>
    <circle cx="228" cy="412" r="18" fill="#2aa772" opacity=".12"/>
    <path d="M221 412h14m-7-7v14" stroke="#2f7c5c" stroke-width="2.5" stroke-linecap="round"/>
    <text x="450" y="405" text-anchor="middle" fill="#2f7c5c" font-size="18" font-weight="700">iterate on data, model size, and runtime</text>
    <text x="450" y="429" text-anchor="middle" fill="#66717e" font-size="14">tune the recipe, rerun locally, compare samples</text>
  </g>
</svg>
