<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">society-of-thought-bench flow</title>
  <desc id="desc">Prompt, persona debate, judge, traces, metrics, and demo flow.</desc>
  <rect width="900" height="600" rx="28" fill="#f5f8fb"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4" fill="none" stroke="#7896c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#355071" flood-opacity=".12"/>
    </filter>
  </defs>
  <text x="72" y="74" fill="#142236" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="700">society-of-thought-bench</text>
  <text x="72" y="110" fill="#5b6674" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18">Measure multi-persona reasoning with traces, evidence, and live demos</text>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 190)">
      <rect width="132" height="86" rx="15" fill="#fff" stroke="#dce6f1"/>
      <text x="66" y="39" text-anchor="middle" fill="#142236" font-size="17" font-weight="700">task</text>
      <text x="66" y="63" text-anchor="middle" fill="#66717e" font-size="14">prompt</text>
    </g>
    <g transform="translate(270 160)">
      <rect width="120" height="78" rx="15" fill="#fff" stroke="#dce6f1"/>
      <text x="60" y="35" text-anchor="middle" fill="#142236" font-size="16" font-weight="700">persona A</text>
      <text x="60" y="57" text-anchor="middle" fill="#66717e" font-size="13">argues</text>
    </g>
    <g transform="translate(270 266)">
      <rect width="120" height="78" rx="15" fill="#fff" stroke="#dce6f1"/>
      <text x="60" y="35" text-anchor="middle" fill="#142236" font-size="16" font-weight="700">persona B</text>
      <text x="60" y="57" text-anchor="middle" fill="#66717e" font-size="13">critiques</text>
    </g>
    <g transform="translate(470 206)">
      <rect width="128" height="92" rx="16" fill="#fff" stroke="#dce6f1"/>
      <text x="64" y="40" text-anchor="middle" fill="#142236" font-size="17" font-weight="700">debate</text>
      <text x="64" y="64" text-anchor="middle" fill="#66717e" font-size="14">trace</text>
    </g>
    <g transform="translate(690 190)">
      <rect width="134" height="86" rx="15" fill="#fff" stroke="#dce6f1"/>
      <text x="67" y="39" text-anchor="middle" fill="#142236" font-size="17" font-weight="700">judge</text>
      <text x="67" y="63" text-anchor="middle" fill="#66717e" font-size="14">metrics</text>
    </g>
  </g>
  <g stroke="#7896c8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M202 233h50"/>
    <path d="M390 199c34 0 44 24 68 37"/>
    <path d="M390 305c34 0 44-24 68-37"/>
    <path d="M598 252h76"/>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="156" y="406" width="588" height="70" rx="20" fill="#ffffff" stroke="#dce6f1"/>
    <text x="246" y="448" fill="#2e7f64" font-size="17" font-weight="700">raw traces</text>
    <text x="390" y="448" fill="#435268" font-size="17" font-weight="700">benchmark evidence</text>
    <text x="600" y="448" fill="#a66e22" font-size="17" font-weight="700">live demo</text>
  </g>
</svg>
