<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">hypothesis-forge research loop</title>
  <desc id="desc">Idea, evidence, falsifier, experiment, and reward loop.</desc>
  <rect width="900" height="600" rx="28" fill="#fbf8f2"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4" fill="none" stroke="#8ea0b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#665a4d" flood-opacity=".13"/>
    </filter>
  </defs>
  <g opacity=".45" stroke="#e5dbca" stroke-width="1">
    <path d="M80 140h740M80 260h740M80 380h740M80 500h740"/>
    <path d="M160 92v420M300 92v420M440 92v420M580 92v420M720 92v420"/>
  </g>
  <text x="76" y="76" fill="#152238" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="31" font-weight="700">hypothesis-forge</text>
  <text x="76" y="112" fill="#5e6571" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18">Reward novelty only when it is grounded and falsifiable</text>
  <g filter="url(#shadow)" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="384" y="154" width="132" height="72" rx="14" fill="#efe6ff" stroke="#cdbcf3"/>
    <text x="450" y="197" text-anchor="middle" fill="#2d2746" font-size="18" font-weight="700">idea</text>
    <rect x="178" y="292" width="150" height="78" rx="14" fill="#ffffff" stroke="#d9e0e6"/>
    <text x="253" y="325" text-anchor="middle" fill="#223044" font-size="17" font-weight="700">evidence</text>
    <text x="253" y="350" text-anchor="middle" fill="#66717e" font-size="14">grounding</text>
    <rect x="574" y="292" width="150" height="78" rx="14" fill="#edf8f1" stroke="#b9dec7"/>
    <text x="649" y="325" text-anchor="middle" fill="#223044" font-size="17" font-weight="700">experiment</text>
    <text x="649" y="350" text-anchor="middle" fill="#66717e" font-size="14">falsifier</text>
    <rect x="353" y="430" width="194" height="66" rx="33" fill="#ffffff" stroke="#d9e0e6"/>
    <text x="450" y="470" text-anchor="middle" fill="#2e7f64" font-size="17" font-weight="700">novelty reward</text>
  </g>
  <g stroke="#8ea0b6" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M416 226L292 286"/>
    <path d="M484 226l124 60"/>
    <path d="M328 332c32 64 76 94 124 94"/>
    <path d="M574 332c-32 64-76 94-124 94"/>
    <path d="M450 430c0-28 0-48 0-78" stroke-dasharray="6 8"/>
  </g>
</svg>
